<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>가을 재킷 카드뉴스</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet"><style>
:root{--ink:#101012;--mute:#8b8b90;--accent:#ff3366;--chip:#f4f3f1;--sans:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#141416;color:#cfcfca;font-family:var(--sans);padding:42px 20px 100px}.head{max-width:1180px;margin:auto;text-align:center}.head h1{font-size:20px;color:#fff;margin:0 0 10px}.head p{font-size:13px;color:#96938c;line-height:1.7;margin:0}.toolbar{margin:20px auto 34px;text-align:center}.toolbar button{font:600 11px var(--sans);letter-spacing:.12em;background:#e8e5de;border:0;padding:12px 22px;cursor:pointer}.board{max-width:1180px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:40px 26px;justify-items:center}.col{width:100%;max-width:360px}.slot{width:100%;position:relative;overflow:hidden}.cap{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 0;font-size:10.5px;color:#8f8c85;letter-spacing:.14em}.cap button{font:500 10px var(--sans);color:#cfccc5;background:transparent;border:1px solid #ffffff2e;padding:6px 11px;cursor:pointer}.card{position:relative;width:540px;height:675px;overflow:hidden;background:#fff;color:var(--ink);transform-origin:top left;display:flex;flex-direction:column;padding:30px 32px 24px}.toprow{display:flex;justify-content:space-between;align-items:center;flex:none;margin-bottom:14px}.handle{font-size:11px;font-weight:700;letter-spacing:.08em}.num{font-size:15px;font-weight:800;color:var(--accent)}.num i{font-style:normal;color:#c9c6bf}.photo{flex:none;align-self:center;width:330px;height:330px;border-radius:6px;overflow:hidden;position:relative;background:#f5f5f3}.photo img{width:100%;height:100%;object-fit:contain;display:block}.badge{position:absolute;top:10px;left:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:800;padding:6px 10px;border-radius:4px}.caption{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}.title{margin:0;font-weight:800;font-size:26px;line-height:1.42;letter-spacing:0;word-break:keep-all}.title em{font-style:normal;box-shadow:inset 0 -12px 0 #ffe14d}.prodline{font-size:12px;font-weight:600;color:#8b8b90;margin-bottom:8px;letter-spacing:.1px}.prodline b{color:#101012;font-weight:800}.metarow{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}.meta{font-size:14px;font-weight:700}.proof{background:var(--chip);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;color:#55555a}.credit{font-size:8px;color:#bdbab3;margin-top:7px}.selling{margin-top:8px;font-size:12px;font-weight:600;color:#55555a;line-height:1.65;letter-spacing:.1px;word-break:keep-all;border-top:1px solid #efedea;padding-top:9px}.foot{flex:none;margin-top:10px;font-size:11px;font-weight:700;color:var(--mute)}.cover .title{font-size:39px;line-height:1.34;letter-spacing:-.2px}.cover .kicker{font-size:14px;font-weight:800;color:var(--accent);letter-spacing:.14em;margin-bottom:10px}.cover .sub,.cta .sub{font-size:14.5px;font-weight:600;color:#55555a;margin:14px 0 0;line-height:1.75;letter-spacing:.1px}.cta .title{font-size:32px;line-height:1.38}.cta .caption{text-align:center;align-items:center}.cta .photo{width:400px;height:380px}@media(max-width:620px){body{padding:28px 12px 70px}.board{grid-template-columns:1fr}.col{max-width:390px}}
@media(max-width:620px){.board{width:100%;grid-template-columns:minmax(0,1fr)}.col{min-width:0;max-width:100%}}
/* 원본 비율을 유지하므로 남는 영역을 채우는 인위적인 사진 프레임은 사용하지 않는다. */
.photo{background:transparent}
.meta s{color:#b6b3ac;font-weight:500;margin-right:4px}
.card.item .photo,.card.cover .photo{width:540px;margin-left:-32px;margin-right:-32px;align-self:stretch;border-radius:0;background:#fff}
.card.item .photo .badge,.card.cover .photo .badge{left:32px;top:14px}
.card.cover .photo{height:340px}
.card.item .photo{height:340px;box-shadow:none}
.card.item .caption{margin-top:12px}
.card.item .photo img,.card.cover .photo img{width:100%;height:100%;object-fit:var(--fit,cover);object-position:var(--pos,50% 20%)}
.cover .caption{margin-top:12px}

/* ===== 2026-09-04 (폐기) 2단 레이아웃: 왼쪽 세로 사진 기둥 + 오른쪽 텍스트 기둥 (표지·상품 카드) ===== */
.card.item .body,.card.cover .body{display:flex;flex:1;min-height:0;gap:20px;margin:0 -32px -24px -32px}
.card.item .body .photo,.card.cover .body .photo{flex:none;width:270px;height:auto;align-self:stretch;margin:0;border-radius:0;background:#fff;box-shadow:none}
.card.item .body .photo img,.card.cover .body .photo img{width:100%;height:100%;object-fit:var(--fit,cover);object-position:var(--pos,50% 50%)}
.card.item .body .photo .badge,.card.cover .body .photo .badge{left:14px;top:14px}
.card.item .body .col,.card.cover .body .col{flex:1;min-width:0;display:flex;flex-direction:column;padding:0 32px 24px 0}
.card.item .body .caption,.card.cover .body .caption{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;margin:0}
.card.item .body .foot,.card.cover .body .foot{flex:none;margin-top:12px}
.card.item .body .title{font-size:21px;line-height:1.36;letter-spacing:-.3px}
.card.item .body .prodline{font-size:11px;margin-bottom:8px}
.card.item .body .metarow{gap:8px;margin-top:10px}
.card.item .body .meta{font-size:13px}
.card.item .body .meta s{margin-right:3px}
.card.item .body .proof{font-size:11px;padding:5px 10px}
.card.item .body .credit{margin-top:8px}
.card.item .body .selling{font-size:11.5px;line-height:1.62;margin-top:10px;padding-top:10px}
.card.cover .body .kicker{font-size:12px;letter-spacing:.12em;margin-bottom:10px}
.card.cover .body .title{font-size:30px;line-height:1.28;letter-spacing:-.4px}
.card.cover .body .sub{font-size:13.5px;line-height:1.7;margin-top:14px}

/* ===== 2026-09-04 전면 이미지형: 사진이 카드 전체, 멘트는 사진 위 하단 오버레이, 숫자 제거, 계정명 오른쪽 하단 ===== */
.card.item,.card.cover{padding:0;display:block}
.card.item .photo,.card.cover .photo{position:absolute;inset:0;width:540px;height:675px;margin:0;border-radius:0;background:#fff;box-shadow:none}
.card.item .photo img,.card.cover .photo img{width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 15%)}
.card.item .photo .badge,.card.cover .photo .badge{left:32px;top:28px;font-size:15px;padding:7px 11px}
.card .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,10,12,.6) 0%,rgba(10,10,12,.38) 20%,rgba(10,10,12,.1) 38%,rgba(10,10,12,0) 50%)}
.card .over{position:absolute;left:32px;right:32px;bottom:20px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.38),0 0 14px rgba(0,0,0,.28)}
.card .over .prodline{font-size:11px;color:rgba(255,255,255,.9);margin-bottom:6px}
.card .over .prodline b{color:#fff}
.card .over .title{font-size:26px;line-height:1.28;letter-spacing:-.3px;color:#fff}
.card .over .title em{box-shadow:none;color:#ffe14d}
.card .over .metarow{margin-top:12px;gap:10px}
.card .over .pricebox{margin-top:10px}
.card .over .was{font-size:12px;font-weight:600;color:rgba(255,255,255,.8)}
.card .over .was s{color:rgba(255,255,255,.8);margin-left:2px}
.card .over .now{display:flex;align-items:baseline;gap:10px;margin-top:2px}
.card .over .now b{font-size:21px;font-weight:800;letter-spacing:-.3px;color:#fff}
.card .over .off{font-size:17px;font-weight:800;color:#ffe14d;letter-spacing:-.2px}
.card .over .off i{font-style:normal;font-size:14px;margin-left:1px}
.card .over .now .proof{margin-left:auto;align-self:center}
.card .over .meta{font-size:14px;color:#fff}
.card .over .meta s{color:rgba(255,255,255,.55)}
.card .over .proof{background:rgba(255,255,255,.16);color:#fff;font-size:12px;text-shadow:none}
.card .over .credit{color:rgba(255,255,255,.7);margin-top:8px}
.card .over .was .credit{margin:0 0 0 10px;font-size:10px;font-weight:500}
.card .over .prodline,.card .over .was{text-shadow:0 1px 2px rgba(0,0,0,.6),0 0 8px rgba(0,0,0,.45)}
.card .over .selling{color:rgba(255,255,255,.92);border-top:1px solid rgba(255,255,255,.22);font-size:11.5px;line-height:1.55;margin-top:8px;padding-top:8px}
.card .over .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:11px;font-weight:700;color:rgba(255,255,255,.8)}
.card .over .bottom .handle{font-size:11.5px;letter-spacing:.08em;color:#fff}
.card.cover .over .kicker{font-size:13px;letter-spacing:.14em;color:#ff5c85;margin-bottom:10px}
.card.cover .over .title{font-size:42px;line-height:1.22;letter-spacing:-.5px}
.card.cover .over .sub{font-size:15px;color:rgba(255,255,255,.85);margin-top:14px;line-height:1.65}
.card.cta .foot{text-align:right;color:#101012;letter-spacing:.08em}
</style></head><body><div class="head"><h1>가을 재킷 카드뉴스 · 전면 이미지형 · @i_s2_fashion</h1><p>표지 → 무드인사이드 · 버던트 · 제너럴아이디어 · 유라고 · 무신사 스탠다드 → CTA (7장) · 축: 보온 정도(얇은 것 → 겨울까지)<br>26FW 3종 + 2025년 이후 2종 · 여성 3 · 남성 2(유니섹스 구성) · 상품 정보: 무신사·29CM 2026-09-23 실측(쿠폰 미적용가)</p></div><div class="toolbar"><button onclick="exportAll()">⬇ 전체 PNG 내보내기 (7장)</button></div><div class="board" id="board"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script>
const cards=[
{kind:'cover',img:'assets/cover-yurago.jpg',pos:'50% 22%',lab:'표지',kicker:'AUTUMN JACKET',title:'아침저녁만 추운 날<br><em>가을 재킷 다섯</em>',sub:'입어 본 사람들의 후기로 두께를 확인했습니다'},
{kind:'item',img:'assets/01-moodinside.jpg',pos:'50% 20%',lab:'무드인사이드',badge:'62%',prod:'무드인사이드 우먼 · <b>하이넥 뮤트 하프 자켓</b> 카키',title:'<em>검정 흰색 베이지</em><br>다 받아주는 카키',meta:'무신사 <s>129,900원</s> 49,900원',proof:'후기 43개 · ⭐ 4.9',sp:'“색감이 어두워서 과하지 않게 여기저기 걸치고 다니기 좋아요. 검정색, 흰색, 베이지 다 잘어울려요 자주 입고 다닙니다. 핏도 스트링 조이면 너무 벙벙하지 않고 예쁜 오버핏으로 떨어져요” —&nbsp;실제&nbsp;후기'},
{kind:'item',img:'assets/02-verdant.jpg',pos:'50% 18%',lab:'버던트',badge:'60%',prod:'버던트 · <b>가먼트다잉 트윌 워크 자켓</b> 카키',title:'안에 후드티를 입어도<br><em>남는 워크 자켓</em>',meta:'무신사 <s>86,500원</s> 34,600원',proof:'후기 56개 · ⭐ 4.9',sp:'“생각보다 좀 큰 편이라서 안에 후드티를 입어도 됩니다. 이너로 얇은 걸 입으실거면 m을 추천합니다. 비주얼은 빈티지한 워크자켓의 정석이라 예쁩니다” —&nbsp;실제&nbsp;후기'},
{kind:'item',img:'assets/03-generalidea.jpg',pos:'50% 18%',lab:'제너럴아이디어',badge:'10%',prod:'제너럴아이디어 · <b>빈티지 워시드 코튼 블루종 점퍼</b>',title:'<em>어깨선이 내려오는</em><br>워시드 코튼 블루종',meta:'무신사 <s>135,000원</s> 121,000원',proof:'후기 0개 · 2026 F/W',sp:'총장 62cm · 어깨너비 51.5cm · 가슴단면 60.5cm(S 실측) · 빈티지 워시드 코튼 —&nbsp;상세&nbsp;페이지&nbsp;표기'},
{kind:'item',img:'assets/04-yurago.jpg',pos:'50% 20%',lab:'유라고',badge:'43%',prod:'유라고 · <b>포켓 레더 오버핏 블루종</b> 블랙',title:'<em>두꺼운 니트를 입고도</em><br>여유가 남는 오버핏',meta:'무신사 <s>185,000원</s> 105,000원',proof:'후기 18개 · ⭐ 5.0',sp:'“오버 핏으로 어디에 걸쳐도 다 잘 어울릴것 같아요 두꺼운 니트류 입고도 입을 수 있어서 추워져도 입을 만 할것 같습니당!! 디테일이 좋은 상품 같아요” —&nbsp;실제&nbsp;후기'},
{kind:'item',img:'assets/05-mustandard.jpg',pos:'50% 15%',lab:'무신사 스탠다드',badge:'10%',prod:'무신사 스탠다드 · <b>14W 코듀로이 미니멀 블루종 재킷</b> 브라운',title:'가을에 적당하고<br><em>겨울까지 가는 코듀로이</em>',meta:'무신사 <s>109,900원</s> 98,790원',proof:'후기 14개 · ⭐ 5.0',sp:'“색상은 쿨 브라운이라 남자들에게 잘 어울려요. 가을에 입기에 적당하고 겨울까지도 괜찮아요” —&nbsp;실제&nbsp;후기'},
{kind:'cta',img:'../../CARD/zzal/20260917.jpg',lab:'CTA',title:'재킷 하나만 잘 골라도<br><em>가을이 편해집니다</em>',sub:'아침에 뭘 걸칠지 고민하는 시간이<br>그만큼 줄어듭니다'}];
function html(c,i){const handle='@i_s2_fashion';if(c.kind==='cta'){return `<div class="card cta" id="card${i}"><div class="toprow"><span class="handle">&nbsp;</span><span class="num">&nbsp;</span></div><div class="photo"><img src="${c.img}" alt="" onload="sizePhoto(this)"></div><div class="caption"><h2 class="title">${c.title}</h2><p class="sub">${c.sub}</p></div><div class="foot">${handle}</div></div>`}
let photo=`<div class="photo"><img src="${c.img}" alt="" style="--pos:${c.pos||'50% 15%'}"></div>`;
const m=c.kind==='item'?c.meta.match(/^(\S+) <s>(.*?)<\/s> (.*)$/):null; // m[1]=판매처(무신사|29CM) — 출처 표기도 여기서 따라간다
let body=c.kind==='cover'?`<div class="kicker">${c.kicker}</div><h2 class="title">${c.title}</h2><p class="sub">${c.sub}</p>`:`<div class="prodline">${c.prod}</div><h2 class="title">${c.title}</h2><div class="pricebox"><div class="was">${m[1]} <s>${m[2]}</s><span class="credit">이미지 출처: ${m[1]}</span></div><div class="now"><b>${m[3]}</b>${c.badge?`<span class="off">${c.badge}<i>↓</i></span>`:''}<span class="proof">${c.proof}</span></div></div><div class="selling">${c.sp}</div>`;
return `<div class="card ${c.kind}" id="card${i}">${photo}<div class="shade"></div><div class="over">${body}<div class="bottom"><span>옆으로 넘기기 →</span><span class="handle">${handle}</span></div></div></div>`}
function sizePhoto(img){const wrap=img.parentElement,isCta=wrap.closest('.cta'),maxW=isCta?400:330,maxH=isCta?380:330,ratio=img.naturalWidth/img.naturalHeight;let w=maxW,h=Math.round(w/ratio);if(h>maxH){h=maxH;w=Math.round(h*ratio)}wrap.style.width=w+'px';wrap.style.height=h+'px'}
cards.forEach((c,i)=>{let col=document.createElement('div');col.className='col';col.innerHTML=`<div class="slot">${html(c,i)}</div><div class="cap"><span>0${i+1} · ${c.lab}</span><button onclick="save(${i})">PNG 저장</button></div>`;board.append(col)});function fit(){document.querySelectorAll('.col').forEach(col=>{let card=col.querySelector('.card'),slot=col.querySelector('.slot'),s=Math.min(1,col.clientWidth/540);card.style.transform=`scale(${s})`;slot.style.height=675*s+'px'})}fit();addEventListener('resize',fit);
async function save(i){if(!window.html2canvas)return;let el=document.querySelector('#card'+i),old=el.style.transform;el.style.transform='none';let canvas=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:'#fff'});el.style.transform=old;let a=document.createElement('a');a.download=`${i+1}.jpg`;a.href=canvas.toDataURL('image/jpeg',.95);a.click()}async function exportAll(){for(let i=0;i<7;i++){await save(i);await new Promise(r=>setTimeout(r,250))}}
</script></body></html>
