<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>autopost cards</title>
<link href="https://cdn.jsdelivr.net/gh/fonts-archive/GmarketSans/GmarketSans.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
/* 전면 이미지형 — card-drafts/autumn-jacket/index.html(09-17판 CSS)에서 실제로 적용되는 규칙만 옮겼다.
   디자인을 바꾸면 card-drafts/README.md와 이 파일을 함께 고친다. */
:root{--ink:#101012;--mute:#8b8b90;--accent:#ff3366;--chip:#f4f3f1;--display:"Gmarket Sans","Pretendard Variable",sans-serif;--sans:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:var(--sans)}
.card{position:relative;width:540px;height:675px;overflow:hidden;background:#fff;color:var(--ink);display:flex;flex-direction:column;padding:30px 32px 24px;font-family:var(--sans)}
.toprow{display:flex;justify-content:space-between;align-items:center;flex:none;margin-bottom:14px}
.handle{font-size:11px;font-weight:700;letter-spacing:.08em}
.photo{flex:none;align-self:center;width:330px;height:330px;border-radius:6px;overflow:hidden;position:relative;background:transparent}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.caption{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
.title{margin:0;font-weight:800;font-size:26px;line-height:1.42;letter-spacing:0;word-break:keep-all}
.title em{font-style:normal;box-shadow:inset 0 -12px 0 #ffe14d}
.prodline{font-size:12px;font-weight:600;color:#8b8b90;margin-bottom:8px;letter-spacing:.1px}
.prodline b{color:#101012;font-weight:800}
.meta{font-size:14px;font-weight:700}
.meta s{color:#b6b3ac;font-weight:500;margin-right:4px}
.proof{background:var(--chip);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;color:#55555a}
.credit{font-size:8px;color:#bdbab3;margin-top:7px}
.selling{margin-top:8px;font-size:12px;font-weight:600;color:#55555a;line-height:1.65;letter-spacing:.1px;word-break:keep-all;border-top:1px solid #efedea;padding-top:9px}
.foot{flex:none;margin-top:10px;font-size:11px;font-weight:700;color:var(--mute)}
.cover .kicker{font-size:14px;font-weight:800;color:var(--accent);letter-spacing:.14em;margin-bottom:10px}
.cover .sub,.cta .sub{font-size:16px;font-weight:600;color:#55555a;margin:14px 0 0;line-height:1.7;letter-spacing:.1px}
.cta .title{font-family:var(--display);font-size:32px;line-height:1.36;letter-spacing:-1.2px;font-weight:700}
.cta .caption{text-align:center;align-items:center}
.cta .photo{width:440px;height:420px}

/* 2026-09-04 전면 이미지형 */
.card.item,.card.cover{padding:0;display:block}
.card.item .photo,.card.cover .photo{position:absolute;inset:0;width:540px;height:675px;margin:0;border-radius:0;background:#fff;box-shadow:none}
.card.item .photo img,.card.cover .photo img{width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 15%)}
.card.cover .photo.collage{display:flex;gap:3px;background:#111}
.card.cover .photo.collage img{flex:1 1 0;min-width:0;height:100%;object-fit:cover}
.card.cover .photo.collage+.shade{background:linear-gradient(to top,rgba(10,10,12,.86) 0%,rgba(10,10,12,.66) 22%,rgba(10,10,12,.22) 36%,rgba(10,10,12,0) 46%)}
.card .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,10,.86) 0%,rgba(8,8,10,.74) 20%,rgba(8,8,10,.5) 34%,rgba(8,8,10,.18) 44%,rgba(8,8,10,0) 54%)}
.card .shade::before{content:"";position:absolute;inset:0;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);-webkit-mask-image:linear-gradient(to top,#000 0%,#000 12%,rgba(0,0,0,0) 30%);mask-image:linear-gradient(to top,#000 0%,#000 12%,rgba(0,0,0,0) 30%)}
.card .over{position:absolute;left:32px;right:32px;bottom:20px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.card .over .prodline{font-size:13px;color:rgba(255,255,255,.9);margin-bottom:7px}
.card .over .prodline b{color:#fff}
.card .over .title{font-family:var(--display);font-size:26px;line-height:1.3;letter-spacing:-1px;color:#fff;font-weight:700}
.card .over .title em{box-shadow:none;color:#ffe14d}
.card .over .pricebox{margin-top:12px}
.card .over .was{font-size:12px;font-weight:600;color:rgba(255,255,255,.8)}
.card .over .was s{color:rgba(255,255,255,.8);margin-left:2px}
.card .over .now{display:flex;align-items:baseline;gap:9px}
.card .over .now b{font-size:23px;font-weight:800;letter-spacing:-.4px;color:#fff}
.card .over .now s{font-size:13px;font-weight:600;color:rgba(255,255,255,.62)}
.card .over .off{font-size:17px;font-weight:800;color:#ffe14d;letter-spacing:-.2px}
.card .over .off i{font-style:normal;font-size:14px;margin-left:1px}
.card .over .now .proof{margin-left:auto;align-self:center}
.card .over .proof{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:600;text-shadow:none;padding:6px 12px}
.card .over .proof .star{color:#ffd54a;font-weight:800;font-style:normal;font-size:13px;vertical-align:0}
.card .over .credit{color:rgba(255,255,255,.7);margin-top:8px}
.card .over .was .credit{margin:0 0 0 10px;font-size:10px;font-weight:500}
.card .over .prodline,.card .over .was{text-shadow:0 1px 2px rgba(0,0,0,.6),0 0 8px rgba(0,0,0,.45)}
.card .over .selling{color:rgba(255,255,255,.94);border-top:1px solid rgba(255,255,255,.2);font-size:13px;line-height:1.52;margin-top:9px;padding-top:9px;font-weight:500}
.card .over .selling .src{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.02em;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:3px;padding:0 5px;margin-right:7px;text-shadow:none;vertical-align:1px}
.card .over .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:11px;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.7)}
.card .over .bottom .handle{font-size:11.5px;letter-spacing:.08em;color:#fff}
.card.cover .over .kicker{font-size:13px;font-weight:700;letter-spacing:.2em;color:rgba(255,255,255,.82);margin-bottom:12px}
.card.cover .over .title{font-size:42px;line-height:1.24;letter-spacing:-1.6px}
.card.cover .over .sub{font-size:16px;font-weight:500;color:rgba(255,255,255,.9);margin-top:14px;line-height:1.6}
/* 2026-10-14 상품 카드 = 사진 위(가림 없음) + 아래 흰 정보 칸 — 사용자 피드백 "상품이 메인인데 상품이 안 보인다" */
.card.item{display:flex;flex-direction:column;background:#fff}
.card.item .photo{position:relative;inset:auto;flex:1 1 auto;min-height:0;width:540px;height:auto}
.card.item .shade{display:none}
.card.item .over{position:relative;left:auto;right:auto;bottom:auto;flex:none;padding:14px 26px 12px;background:#fff;color:#101012;text-shadow:none}
.card.item .over .prodline,.card.item .over .was{text-shadow:none}
.card.item .over .prodline{font-size:12px;color:#77777c;margin-bottom:4px}
.card.item .over .prodline b{color:#101012}
.card.item .over .title{color:#101012;font-size:23px;line-height:1.28;letter-spacing:-.8px}
.card.item .over .title em{color:#101012;box-shadow:inset 0 -9px 0 #ffe14d}
.card.item .over .pricebox{margin-top:8px}
.card.item .over .now b{color:#101012;font-size:20px}
.card.item .over .off{color:#ff3366;font-size:16px}
.card.item .over .now s{color:#a6a6ab;font-size:12px}
.card.item .over .proof{background:#f4f3f1;border:0;color:#3d3d42;font-size:12px;padding:5px 11px}
.card.item .over .proof .star{color:#ffb800;font-size:12px}
.card.item .over .selling{color:#3d3d42;border-top:1px solid #ecebe8;font-size:12px;line-height:1.5;margin-top:8px;padding-top:7px}
.card.item .over .selling .src{color:#101012;background:#ffe14d;border:0;font-size:10.5px;padding:0 5px}
.card.item .over .bottom{color:#a6a6ab;margin-top:7px;font-size:10.5px}
.card.item .over .bottom .handle{color:#101012;font-size:10.5px}
.card.cta .foot{text-align:right;color:#101012;letter-spacing:.08em}
#board .card{margin:0 0 20px}
</style></head><body><div id="board"></div>
<script>
// window.CARDS 는 render.py 가 페이지 로드 전에 주입한다. 텍스트 필드는 build.py 가 이미 이스케이프했다(<em>·<br>만 허용).
const HANDLE = '@i_s2_fashion';
function bottom(left){return `<div class="bottom"><span>${left||'옆으로 넘기기 →'}</span><span class="handle">${HANDLE}</span></div>`}
function card(c,i){
  if(c.kind==='cta'){
    return `<div class="card cta" id="card${i}"><div class="toprow"><span class="handle">&nbsp;</span><span>&nbsp;</span></div><div class="photo"><img src="${c.img}" alt="" onload="sizePhoto(this)"></div><div class="caption"><h2 class="title">${c.title}</h2><p class="sub">${c.sub||''}</p></div><div class="foot">${HANDLE}</div></div>`;
  }
  const photo = (c.imgs && c.imgs.length)
    ? `<div class="photo collage">${c.imgs.map(p=>`<img src="${p.img}" alt="" style="object-position:${p.pos||'50% 25%'}">`).join('')}</div><div class="shade"></div>`
    : `<div class="photo"><img src="${c.img}" alt="" style="--pos:${c.pos||'50% 15%'}"></div><div class="shade"></div>`;
  let body;
  if(c.kind==='cover'){
    body = `${c.kicker?`<div class="kicker">${c.kicker}</div>`:''}<h2 class="title">${c.title}</h2><p class="sub">${c.sub||''}</p>`;
  } else {
    body = `<div class="prodline">${c.prod}</div><h2 class="title">${c.title}</h2><div class="pricebox"><div class="now"><b>${c.sale}</b>${c.off?`<span class="off">${c.off}<i>↓</i></span><s>${c.normal}</s>`:''}<span class="proof">${c.proof}</span></div></div><div class="selling">${c.sp}</div>`;
  }
  const left = c.kind==='cover' ? '' : `가격·이미지 ${c.mall}`;
  return `<div class="card ${c.kind}" id="card${i}">${photo}<div class="over">${body}${bottom(left)}</div></div>`;
}
function sizePhoto(img){const wrap=img.parentElement,ratio=img.naturalWidth/img.naturalHeight;let w=440,h=Math.round(w/ratio);if(h>420){h=420;w=Math.round(h*ratio)}wrap.style.width=w+'px';wrap.style.height=h+'px'}
document.getElementById('board').innerHTML=(window.CARDS||[]).map(card).join('');
</script></body></html>
